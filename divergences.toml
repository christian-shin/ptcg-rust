# Approved divergences from Twinleaf (PLAN.md 4.7).
#
# Each [[divergence]] has an id, a description, a justification and a matcher
# the diff tool applies: a trace whose first divergence has kind `what`
# (options / prompt / hash / panic / ...) and whose detail contains
# `detail_contains` is reported as approved instead of diverged.

# The two approved Dangle Tail divergences ("dangle-tail-runaway-aliases" and
# "dangle-tail-runaway-prompts") were removed when Slowpoke SCR's Dangle Tail
# duplication was fixed in both engines (phase 4b, W1-E). The Rust caps they
# described (32 prompts/items, 32 scratch lists) stay as safety nets only; no
# card should reach them now.
