[package]
name = "ptcg-python"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "_ptcg"
crate-type = ["cdylib"]

[dependencies]
ptcg = { path = "../engine" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }

[profile.release]
opt-level = 3
lto = "thin"

# The shipped wheel (maturin --profile dist): fat LTO, one codegen unit, baseline x86-64, panic unwind as in release.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
