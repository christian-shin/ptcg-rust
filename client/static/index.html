<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PTCG Table</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='3' width='20' height='26' rx='3' fill='%233b5bdb'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23fff' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <main id="board">
    <div id="opp-hand" class="hand-strip"></div>
    <section id="opp-row" class="row opp"></section>
    <section id="center">
      <div id="c-left"></div>
      <div id="c-mid"><div id="opp-active" class="active-zone"></div><div id="you-active" class="active-zone"></div></div>
      <div id="c-right"><div id="ctrl"></div></div>
    </section>
    <section id="you-row" class="row you"></section>
    <div id="hand"></div>
  </main>
  <aside id="side">
    <div id="side-top">
      <div id="status"></div>
      <button id="btn-menu" class="icon-btn" title="Menu" aria-label="Menu">&#9776;</button>
    </div>
    <div id="preview"></div>
    <div id="log"></div>
  </aside>
</div>
<div id="menu-pop" hidden></div>
<div id="pop" hidden></div>
<div id="modal" hidden></div>
<div id="zoom" hidden></div>
<div id="banner" hidden></div>
<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
