# Rust engine checks (the oracle-free tier 4, PLAN.md 4.4): unit and
# integration tests, every scenario in Rust (`scen`: expect assertions,
# invariants, stuck prompts, errors, panics) and fresh-seed self-play
# (`tools/fuzz.py`: meta decks plus random legal pool decks). Failing games'
# traces are uploaded as artifacts; `diff` replays them.
name: rust
run-name: rust ${{ github.event_name }} ${{ inputs.games || github.sha }}

on:
  push:
    branches: [main]
    paths: ["engine/**", "tools/**", "data/**", "decks/**", "scenarios/**", ".github/workflows/rust.yml"]
  workflow_dispatch:
    inputs:
      games:
        description: "Fuzz games"
        default: "20000"
      seed:
        description: "Seed block 1000-41999 (empty: from the run number)"
        default: ""

env:
  GAMES: ${{ inputs.games || '20000' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            engine/target
          key: cargo-${{ hashFiles('engine/Cargo.lock') }}
      - name: Build
        run: cargo build --release --manifest-path engine/Cargo.toml --bins
      - name: Tests
        run: cargo test --release --manifest-path engine/Cargo.toml
      - name: Scenarios
        run: engine/target/release/scen scenarios --games 8 --quiet --full
      - name: Fuzz
        run: |
          SEED="${{ inputs.seed }}"
          if [ -z "$SEED" ]; then SEED=$((1000 + GITHUB_RUN_NUMBER % 41000)); fi
          python3 tools/fuzz.py --games "$GAMES" --seed "$SEED" --out fuzz-out --full
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: fuzz-out
          if-no-files-found: ignore
