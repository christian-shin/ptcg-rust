# Rust engine checks, as separate jobs
# after one build: unit and integration tests, the golden-corpus replay, every scenario (`scen`: expect assertions, invariants,
# stuck prompts, errors, panics) and fresh-seed self-play (`tools/fuzz.py`:
# meta decks plus random legal pool decks) split across runners.
#
# Runs on pushes to main and to ci/** branches (`tools/ci.py` pushes the
# current commit to ci/<branch> and waits for the result), and on demand.
# Failing games' traces are uploaded as artifacts; `diff` replays them.
name: rust
run-name: rust ${{ github.ref_name }} ${{ inputs.games || '' }}

on:
  push:
    branches: [main, "ci/**"]
    paths: ["engine/**", "tools/**", "data/**", "decks/**", "scenarios/**", ".github/workflows/rust.yml"]
  workflow_dispatch:
    inputs:
      games:
        description: "Fuzz games per shard"
        default: "25000"
      shards:
        description: "Fuzz shards (parallel runners, 1-16)"
        default: "4"
      seed:
        description: "Seed block 1000-41999 (empty: from the run number)"
        default: ""

env:
  GAMES: ${{ inputs.games || '25000' }}
  SHARDS: ${{ inputs.shards || '4' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      shards: ${{ steps.m.outputs.shards }}
      seed: ${{ steps.m.outputs.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            engine/target
          key: cargo-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}-${{ github.sha }}
          restore-keys: cargo-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}-
      - name: Build
        run: cargo build --release --manifest-path engine/Cargo.toml --bins
      - id: m
        run: |
          SEED="${{ inputs.seed }}"
          if [ -z "$SEED" ]; then SEED=$((1000 + GITHUB_RUN_NUMBER % 41000)); fi
          echo "seed=$SEED" >> "$GITHUB_OUTPUT"
          echo "shards=$(python3 -c "import json; print(json.dumps(list(range(max(1, min(16, int('$SHARDS')))))))")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: bins
          path: |
            engine/target/release/fuzz
            engine/target/release/diff
            engine/target/release/scen
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            engine/target
          key: cargo-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}-${{ github.sha }}
          restore-keys: cargo-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}-
      - name: Unit and integration tests
        run: cargo test --release --manifest-path engine/Cargo.toml

  # Golden-corpus replay: 20,001 recorded games through `diff`; the set of diverged games must equal
  # tools/golden-expected.txt (each a rules fix). The corpus is a release asset (tools/golden-corpus.txt
  # names it; tools/golden_pack.py publishes it), cached per corpus name.
  golden:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bins
          path: engine/target/release
      - run: chmod +x engine/target/release/*
      - id: c
        run: echo "name=$(tr -d '[:space:]' < tools/golden-corpus.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: golden-dl
          key: golden-${{ steps.c.outputs.name }}
      - name: Download corpus
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N="${{ steps.c.outputs.name }}"
          mkdir golden-dl
          gh release download "golden-$N" --repo "$GITHUB_REPOSITORY" --dir golden-dl --pattern "$N.tar.*" --pattern SHA256SUMS
      - name: Extract
        run: |
          N="${{ steps.c.outputs.name }}"
          (cd golden-dl && grep " $N\.tar" SHA256SUMS | sha256sum -c -)
          mkdir golden && tar -C golden -xf golden-dl/$N.tar.*
          ls golden/traces | wc -l
      # diff exits non-zero when any game diverges (expected for the rules fixes): the check below decides.
      - name: Replay
        run: |
          engine/target/release/diff golden/traces --quiet --threads "$(nproc)" > golden-diff.txt || true
          tail -3 golden-diff.txt
      - name: Check against tools/golden-expected.txt
        run: python3 tools/golden_check.py golden-diff.txt
      - name: Replay under PTCG_VERIFY_CACHE=1
        run: |
          PTCG_VERIFY_CACHE=1 engine/target/release/diff golden/traces --quiet --threads "$(nproc)" > golden-diff-verify.txt || true
          tail -3 golden-diff-verify.txt
      - name: Check the VERIFY_CACHE replay
        run: python3 tools/golden_check.py golden-diff-verify.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diff
          path: golden-diff*.txt
          if-no-files-found: ignore

  scenarios:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bins
          path: engine/target/release
      - run: chmod +x engine/target/release/*
      - name: Scenarios
        run: engine/target/release/scen scenarios --games 8 --quiet --full

  # Fast legality checked against the full trial on every candidate (PTCG_VERIFY_LEGAL=1 panics on a
  # difference): the guard for legality decided without trials (porting S4 / Phase 5).
  legal:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bins
          path: engine/target/release
      - run: chmod +x engine/target/release/*
      - name: Verify legality
        env:
          PTCG_VERIFY_LEGAL: "1"
        run: |
          python3 tools/fuzz.py --games 20000 --seed "${{ needs.build.outputs.seed }}" --start 900000 --out legal-out --full
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: legal-failures
          path: legal-out
          if-no-files-found: ignore

  fuzz:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.build.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bins
          path: engine/target/release
      - run: chmod +x engine/target/release/*
      - name: Fuzz
        run: |
          python3 tools/fuzz.py --games "$GAMES" --seed "${{ needs.build.outputs.seed }}" \
            --start $(( ${{ matrix.shard }} * GAMES )) --out fuzz-out --full
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures-${{ matrix.shard }}
          path: fuzz-out
          if-no-files-found: ignore
